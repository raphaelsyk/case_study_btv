[project]
name = "case-study-btv"
version = "0.1.0"
description = "Data pipeline for evaluating earnings calls"
readme = "README.md"
authors = [
    { name = "Raphael Schymczyk", email = "raphael.schymczyk@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docling>=2.116.0",
    "google-genai>=2.15.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["earnings_calls"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: exercises real external services (docling + Gemini); needs GCP credentials, run explicitly via `-m integration`",
]

