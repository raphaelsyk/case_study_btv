line-length = 120
fix = true
output-format = "grouped"
exclude = [".venv"]

[lint]
select = [
	"E",   # pycodestyle errors
	"W",   # pycodestyle warnings
	"F",   # pyflakes
	"C90", # mccabe
	"I",   # isort
	"S",   # flake8-bandit
	"B",   # flake8-bugbear
	"COM", # flake8-commas
	"C4",  # flake8-comprehensions
	"T10", # flake8-debugger
	"T20", # flake8-print
	"Q",   # flake8-quotes
	"LOG", # flake8-logging
	"G",   # flake8-logging-format
	"RUF", # Ruff-specific rules
]
fixable = [
	"E",   # pycodestyle errors
	"F",   # pyflakes
	"Q",   # flake8-quotes
	"I",   # isort
	"RUF", # Ruff-specific rules
]
ignore = [
	"S101",   # use of assert detected
	"B905",   # zip() without explicit struct= parameter
	"COM812", # missing trailing comma (conflicts somehow with ruff formatter)
]

[format]
quote-style = "single"


[lint.flake8-quotes]
inline-quotes = "single"
